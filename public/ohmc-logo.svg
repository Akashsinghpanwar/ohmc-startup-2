<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <!-- CO2 molecule -->
  <!-- Left O atom -->
  <circle cx="52" cy="32" r="14" stroke="#16a34a" stroke-width="3" fill="none"/>
  <!-- Left O inner -->
  <circle cx="52" cy="32" r="6" fill="#16a34a" opacity="0.2"/>
  <!-- Bond lines left -->
  <line x1="66" y1="28" x2="96" y2="28" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="36" x2="96" y2="36" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- C atom center -->
  <circle cx="110" cy="32" r="14" stroke="#16a34a" stroke-width="3" fill="white"/>
  <text x="110" y="37.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#16a34a">C</text>
  <!-- Bond lines right -->
  <line x1="124" y1="28" x2="154" y2="28" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="36" x2="154" y2="36" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right O atom -->
  <circle cx="168" cy="32" r="14" stroke="#16a34a" stroke-width="3" fill="none"/>
  <circle cx="168" cy="32" r="6" fill="#16a34a" opacity="0.2"/>

  <!-- ohmc wordmark -->
  <text x="10" y="90" font-family="Inter, -apple-system, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#16a34a">oh</text>
  <text x="110" y="90" font-family="Inter, -apple-system, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#111827">mc</text>

  <!-- Tagline -->
  <text x="10" y="112" font-family="Inter, -apple-system, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="#6b7280">CONNECTING CARBON, CREATING IMPACT.</text>
</svg>
