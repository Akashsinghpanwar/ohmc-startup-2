        - text: Carbon markets are locked.
        - text: We open them.
      - paragraph [ref=e84]: Small landowners, farmers and crofters own the land that holds Scotland's carbon future — but fixed validation costs, technical complexity and a post-2021 credibility crisis have made markets inaccessible to all but the largest estates.
      - paragraph [ref=e85]: OHMC is purpose-built first-mile infrastructure. We handle the screening, evidence and routing — you focus on the land.
