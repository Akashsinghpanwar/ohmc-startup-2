        - img [ref=e100]
        - heading "Draw your boundary" [level=3] [ref=e102]
        - paragraph [ref=e103]: Use our interactive map to outline your land parcel. We instantly pull real Sentinel-2 satellite data, soil carbon readings and land cover classification — no site visit required.
      - generic [ref=e104]:
        - generic [ref=e105]: "02"
        - img [ref=e107]
        - heading "Get your assessment" [level=3] [ref=e110]
        - paragraph [ref=e111]: Our rules engine checks your land against WCC and Peatland Code eligibility criteria. You receive a transparent eligibility score, pathway recommendation and indicative carbon value range.
      - generic [ref=e112]:
        - generic [ref=e113]: "03"
        - img [ref=e115]
        - heading "Build your evidence" [level=3] [ref=e118]
        - paragraph [ref=e119]: We generate a structured evidence pack and route you to approved VVBs, ecologists and labs. Every step is tracked in your project dashboard.
      - generic [ref=e120]:
        - generic [ref=e121]: "04"
        - img [ref=e123]
        - heading "Connect with buyers" [level=3] [ref=e128]
        - paragraph [ref=e129]: Once your project is verified, it appears in our curated marketplace — with clear trust labels so buyers can transact with confidence.
