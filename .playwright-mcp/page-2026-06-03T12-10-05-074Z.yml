    - generic [ref=e69]:
      - paragraph [ref=e70]: The problem
      - heading "Carbon markets are locked. We open them." [level=2] [ref=e71]:
        - text: Carbon markets are locked.
        - text: We open them.
      - paragraph [ref=e72]: Small landowners, farmers and crofters own the land that holds Scotland's carbon future — but fixed validation costs, technical complexity and a post-2021 credibility crisis have made markets inaccessible to all but the largest estates.
      - paragraph [ref=e73]: OHMC is purpose-built first-mile infrastructure. We handle the screening, evidence and routing — you focus on the land.
    - generic [ref=e74]:
      - generic [ref=e77]:
        - strong [ref=e78]: Market access
        - paragraph [ref=e79]: WCC validation alone runs to thousands of pounds — well above the break-even for most small parcels.
      - generic [ref=e82]:
        - strong [ref=e83]: Information asymmetry
        - paragraph [ref=e84]: Landowners don't know if their land qualifies, which standard applies, or who to approach.
      - generic [ref=e87]:
        - strong [ref=e88]: Trust collapse
        - paragraph [ref=e89]: 94% of rainforest credits were found to deliver no real benefit. Buyers now demand evidence — and supply can't meet it.
  - generic [ref=e91]:
    - generic [ref=e92]:
      - paragraph [ref=e93]: How it works
      - heading "Four steps from land to income." [level=2] [ref=e94]
      - paragraph [ref=e95]: Each step is independently valuable. You don't have to commit to the full journey to get value from OHMC.
    - generic [ref=e96]:
