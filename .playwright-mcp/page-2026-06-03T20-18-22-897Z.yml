    - generic [ref=e81]:
      - paragraph [ref=e82]: The access problem
      - heading "Carbon markets are locked. We open them." [level=2] [ref=e83]:
        - text: Carbon markets are locked.
        - text: We open them.
      - paragraph [ref=e84]: The route from raw land to a saleable credit is long, fragmented and expensive. Fixed validation costs make small projects sub-scale — not because the land isn't suitable, but because the economics don't work without infrastructure to bundle and automate them.
    - generic [ref=e85]:
      - generic [ref=e86]:
        - img [ref=e88]
        - generic [ref=e91]: £10,000+WCC validation cost
        - heading "High market-entry costs" [level=3] [ref=e92]
        - paragraph [ref=e93]: WCC validation alone costs thousands of pounds per project — well above the break-even point for parcels under ~20 ha. Most small landowners never start.
      - generic [ref=e94]:
        - img [ref=e96]
        - generic [ref=e98]: 94%of rainforest credits = phantom
        - heading "Trust and integrity crisis" [level=3] [ref=e99]
        - paragraph [ref=e100]: 94% of rainforest credits examined by The Guardian / Die Zeit investigation delivered no real climate benefit. Buyers now demand verifiable, domestic supply.
      - generic [ref=e101]:
        - img [ref=e103]
        - generic [ref=e106]: 9 stepsfrom land to verified credit
        - heading "Information asymmetry" [level=3] [ref=e107]
        - paragraph [ref=e108]: Landowners don't know if their land qualifies, which standard applies, what documentation is needed, or which verifier to approach. We solve this with one scan.
