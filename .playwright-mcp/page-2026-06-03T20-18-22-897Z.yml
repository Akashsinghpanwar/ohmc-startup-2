  - generic [ref=e272]:
    - generic [ref=e273]:
      - paragraph [ref=e274]: Integrity by design
      - heading "Built on UK recognised standards. Never a black box." [level=2] [ref=e275]:
        - text: Built on UK recognised standards.
        - text: Never a black box.
      - paragraph [ref=e276]: CarbonOS uses a deterministic, standards-bound rules engine — not AI — to quantify anything credit-relevant. Machine learning estimates, prioritises and flags. Independent VVBs validate and verify. Always.
    - generic [ref=e277]:
      - generic [ref=e278]:
        - generic [ref=e279]: WCC
        - heading "Woodland Carbon Code" [level=4] [ref=e280]
        - paragraph [ref=e281]: Governs woodland-creation projects. Validation confirms expected sequestration claims; verification converts PIUs into tradable WCUs on the UK Land Carbon Registry.
        - generic [ref=e282]: PIUs → WCUs on verificationValidated by approved VVBs
      - generic [ref=e283]:
        - generic [ref=e284]: PC
        - heading "Peatland Code" [level=4] [ref=e285]
        - paragraph [ref=e286]: Governs peatland restoration (IUCN UK). All projects must be independently validated and verified by OF&G, Soil Association or other approved bodies. Scotland holds ~80% of UK eligible peatland.
        - generic [ref=e287]: 1.4M ha degraded in Scotland250,000 ha target by 2030
      - generic [ref=e288]:
        - generic [ref=e289]: UKLCR
        - heading "UK Land Carbon Registry" [level=4] [ref=e290]
        - paragraph [ref=e291]: PIUs represent potential future sequestration only. They cannot be used, retired, reported or listed on an exchange. This PIU/verified credit distinction is the most important compliance fact on the platform.
        - generic [ref=e292]: PIUs ≠ verified creditsRegistry-linked audit trail
      - generic [ref=e293]:
        - generic [ref=e294]: S2
        - heading "Sentinel-2 MRV Data" [level=4] [ref=e295]
        - paragraph [ref=e296]: Real Sentinel-2 L2A imagery at 10m resolution processed live over your boundary. NDVI, NDWI, soil moisture — authoritative open data from ESA Copernicus, not estimates from a database.
        - generic [ref=e297]: 10m resolution, 5-day revisitESA / Copernicus open data
